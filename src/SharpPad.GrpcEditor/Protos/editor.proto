syntax = "proto3";

option csharp_namespace = "SharpPad.GrpcEditor.Protos";

package editor;

service EditorService {
  rpc Initialize (InitializeRequest) returns (InitializeReply);
  rpc GetCompletions (CompletionRequest) returns (CompletionReply);
  rpc GetHoverInfo (HoverInfoRequest) returns (HoverInfoReply);
  rpc GetSignatureHelp (SignatureHelpRequest) returns (SignatureHelpReply);      
  rpc GetDefinition (DefinitionRequest) returns (DefinitionReply);
  rpc GetSemanticTokens (SemanticTokensRequest) returns (SemanticTokensReply);   
  rpc FormatCode (FormatCodeRequest) returns (FormatCodeReply);
  rpc GetDiagnostics (DiagnosticsRequest) returns (DiagnosticsReply);
  rpc GetQuickFixes (QuickFixRequest) returns (QuickFixReply);
  rpc ExecuteCode (ExecuteCodeRequest) returns (ExecuteCodeReply);

  // Connection Management
  rpc GetConnections (GetConnectionsRequest) returns (GetConnectionsReply);      
  rpc SaveConnection (SaveConnectionRequest) returns (SaveConnectionReply);      
  rpc DeleteConnection (DeleteConnectionRequest) returns (DeleteConnectionReply);
  rpc TestConnection (TestConnectionRequest) returns (TestConnectionReply);      

  // Schema & Code Gen
  rpc GetDatabaseSchema (GetDatabaseSchemaRequest) returns (GetDatabaseSchemaReply);
  rpc GenerateModels (GenerateModelsRequest) returns (GenerateModelsReply);      
  rpc GetGeneratedModels (GetGeneratedModelsRequest) returns (GetGeneratedModelsReply);
  rpc ConnectToDatabase (ConnectRequest) returns (ConnectReply);
}

message InitializeRequest {
  string projectPath = 1;
  repeated string assemblyPaths = 2;
}

message InitializeReply {
  bool success = 1;
  string errorMessage = 2;
}

message CompletionRequest {
  string code = 1;
  int32 position = 2;
  repeated SourceFile extraFiles = 3;
}

message CompletionReply {
  repeated CompletionItem items = 1;
}

message CompletionItem {
  string displayText = 1;
  string insertText = 2;
  string kind = 3;
  string sortText = 4;
}

message HoverInfoRequest {
  string code = 1;
  int32 position = 2;
  repeated SourceFile extraFiles = 3;
}

message HoverInfoReply {
  bool hasInfo = 1;
  string information = 2;
  int32 offsetFrom = 3;
  int32 offsetTo = 4;
}

message SignatureHelpRequest {
  string code = 1;
  int32 position = 2;
  repeated SourceFile extraFiles = 3;
}

message SignatureHelpReply {
  bool hasHelp = 1;
  repeated SignatureItem signatures = 2;
  int32 activeParameter = 3;
  int32 activeSignature = 4;
}

message SignatureItem {
  string label = 1;
  string documentation = 2;
  repeated ParameterItem parameters = 3;
}

message ParameterItem {
  string label = 1;
  string documentation = 2;
}

message DefinitionRequest {
  string code = 1;
  int32 position = 2;
  repeated SourceFile extraFiles = 3;
}

message DefinitionReply {
  bool hasDefinition = 1;
  string filePath = 2;
  int32 line = 3;
  int32 column = 4;
}

message SemanticTokensRequest {
  string code = 1;
  repeated SourceFile extraFiles = 2;
}

message SemanticTokensReply {
  repeated int32 data = 1;
}

message FormatCodeRequest {
  string code = 1;
}

message FormatCodeReply {
  string formattedCode = 1;
}

message DiagnosticsRequest {
  string code = 1;
  repeated SourceFile extraFiles = 2;
}

message DiagnosticsReply {
  repeated DiagnosticItem diagnostics = 1;
}

message QuickFixRequest {
  string code = 1;
  int32 position = 2;
  repeated SourceFile extraFiles = 3;
}

message QuickFixReply {
  repeated QuickFixItem fixes = 1;
}

message QuickFixItem {
  string title = 1;
  string newText = 2;
  int32 spanStart = 3;
  int32 spanLength = 4;
}

message ExecuteCodeRequest {
  string code = 1;
  string typeName = 2;
  string methodName = 3;
  repeated SourceFile extraFiles = 4;
  string connectionId = 5;
}

message SourceFile {
  string fileName = 1;
  string content = 2;
}

message ExecuteCodeReply {
  bool success = 1;
  string output = 2; // For simple string output
  string errorMessage = 3;
  repeated DiagnosticItem diagnostics = 4;
  string consoleOutput = 5;
}

message DiagnosticItem {
  string id = 1;
  string message = 2;
  string severity = 3;
  int32 line = 4;
  int32 column = 5;
}

message ConnectionInfo {
  string id = 1;
  string name = 2;
  string provider = 3; // "SqlServer", "PostgreSQL", "Sqlite", "MySql"
  string connectionString = 4;
  string lastGeneratedDate = 5;
}

message GetConnectionsRequest { }

message GetConnectionsReply {
  repeated ConnectionInfo connections = 1;
}

message SaveConnectionRequest {
  ConnectionInfo connection = 1;
}

message SaveConnectionReply {
  bool success = 1;
  string errorMessage = 2;
  string id = 3; // New ID if created
}

message DeleteConnectionRequest {
  string id = 1;
}

message DeleteConnectionReply {
  bool success = 1;
  string errorMessage = 2;
}

message TestConnectionRequest {
  string connectionString = 1;
  string provider = 2;
}

message TestConnectionReply {
  bool success = 1;
  string message = 2;
}

message GetDatabaseSchemaRequest {
  string connectionId = 1;
  string tableName = 2;
  bool tablesOnly = 3;
}

message GetDatabaseSchemaReply {
  bool success = 1;
  string errorMessage = 2;
  DatabaseSchema schema = 3;
}

message DatabaseSchema {
  string name = 1;
  repeated TableSchema tables = 2;
}

message TableSchema {
  string name = 1;
  repeated ColumnSchema columns = 2;
}

message ColumnSchema {
  string name = 1;
  string dataType = 2;
  bool isNullable = 3;
  bool isPrimaryKey = 4;
}

message GenerateModelsRequest {
  string connectionId = 1;
  string namespace = 2; // e.g. "SharpPad.Models.ConnId"
}

message GenerateModelsReply {
  bool success = 1;
  string errorMessage = 2;
  repeated string generatedFilePaths = 3;
}

message ConnectRequest {
  string connectionId = 1;
}

message ConnectReply {
  bool success = 1;
  string errorMessage = 2;
  repeated SourceFile generatedFiles = 3;
}

message GetGeneratedModelsRequest {
  string connectionId = 1;
}

message GetGeneratedModelsReply {
  bool success = 1;
  string errorMessage = 2;
  repeated SourceFile generatedFiles = 3;
}
